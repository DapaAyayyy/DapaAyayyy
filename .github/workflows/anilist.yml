name: Favorites 

on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          user: Dapa_Ayayyy
          template: classic
          base: ""

          # output file
          filename: metrics.plugin.anilist.svg

          # AniList plugin
          plugin_anilist: yes
          plugin_anilist_user: DapaAyayyy
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites, watching
          plugin_anilist_limit: 5